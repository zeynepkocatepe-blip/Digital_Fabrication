name: Publish Hugo site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -fL https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_0.167.0_linux-amd64.tar.gz -o /tmp/hugo.tar.gz
          mkdir -p /tmp/hugo-bin
          tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo-bin
          echo "/tmp/hugo-bin" >> "$GITHUB_PATH"

      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Istanbul
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5