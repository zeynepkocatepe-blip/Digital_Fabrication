<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zeynep's DigiFab</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080e1e;
      color: #f5f7ff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      height: 75px;
      border-bottom: 1px solid rgba(255,255,255,0.08);

      display: flex;
      align-items: center;
    }

    .nav {
      width: 100%;
      max-width: 1300px;

      margin: auto;
      padding: 0 45px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
    }

    nav a:hover {
      color: white;
    }


    /* HERO */

    .hero {
      max-width: 1250px;
      min-height: 680px;

      margin: auto;
      padding: 40px 70px;

      display: grid;
      grid-template-columns: 0.9fr 1.1fr;

      align-items: center;
    }

    .hero-text h1 {
      font-size: clamp(65px, 7vw, 100px);
      line-height: 0.95;

      letter-spacing: -5px;
      font-weight: 750;
    }

    .hero-image {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image::before {
      content: "";

      position: absolute;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      background: radial-gradient(
        circle,
        rgba(90, 76, 220, 0.16),
        transparent 68%
      );

      filter: blur(15px);
    }

    .hero-image img {
      position: relative;
      z-index: 2;

      width: min(560px, 100%);

      filter:
        drop-shadow(0 0 25px rgba(95, 80, 230, 0.25))
        drop-shadow(0 0 50px rgba(95, 80, 230, 0.10));
    }


    /* RECENT POSTS */

    .posts {
      max-width: 1000px;

      margin: auto;
      padding: 20px 30px 100px;
    }

    .posts h2 {
      font-size: 29px;
      margin-bottom: 30px;
    }

    .post-card {
      display: block;

      padding: 24px 28px;
      margin-bottom: 16px;

      background: #111a2d;

      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;

      text-decoration: none;
      color: white;

      transition: 0.2s;
    }

    .post-card:hover {
      transform: translateY(-3px);
      background: #17223a;
    }

    .post-card h3 {
      margin-bottom: 7px;
      font-size: 21px;
    }

    .post-card p {
      color: #8f9bb3;
      font-size: 14px;
    }


    footer {
      text-align: center;
      padding: 40px;

      color: #64748b;
      font-size: 13px;
    }


    @media (max-width: 800px) {

      .nav {
        padding: 0 25px;
      }

      nav {
        display: none;
      }

      .hero {
        display: flex;
        flex-direction: column;

        text-align: center;

        min-height: auto;

        padding: 90px 25px 50px;
      }

      .hero-text h1 {
        font-size: 60px;
        letter-spacing: -3px;
      }

      .hero-image {
        margin-top: 50px;
      }

      .hero-image img {
        width: 90%;
      }

      .posts {
        padding: 60px 25px 90px;
      }
    }

  </style>
</head>


<body>

<header>

  <div class="nav">

    <a class="logo" href="{{ "/" | relURL }}">
      Zeynep's DigiFab
    </a>

    <nav>
      <a href="{{ "/" | relURL }}">Home</a>
      <a href="{{ "about/" | relURL }}">About Me</a>
      <a href="{{ "posts/" | relURL }}">Assignments</a>
      <a href="{{ "projects/" | relURL }}">Projects</a>
    </nav>

  </div>

</header>


<main>

  <section class="hero">

    <div class="hero-text">

      <h1>
        Zeynep's<br>
        DigiFab
      </h1>

    </div>


    <div class="hero-image">

      <img
        src="{{ "astronaut.png" | relURL }}"
        alt="Astronaut working on a laptop"
      >

    </div>

  </section>


  <section class="posts">

    <h2>Recent Posts</h2>


    {{ range first 5 (where .Site.RegularPages "Section" "posts") }}

    <a class="post-card" href="{{ .RelPermalink }}">

      <h3>{{ .Title }}</h3>

      <p>
        {{ .Date.Format "January 2, 2006" }}
      </p>

    </a>

    {{ end }}


  </section>

</main>


<footer>
  © 2026 Zeynep's DigiFab
</footer>


</body>
</html>
